name: Validate working draft revision fence

on:
  pull_request:
    branches:
      - main
    paths:
      - src/routes/mail.tsx
      - src/routes/api/mail-working-draft-send.ts
      - src/lib/mail-working-draft.server.ts
      - supabase/migrations/20260821152000_working_draft_send_revision_fence.sql
      - src/lib/__tests__/mail-working-draft-send-revision-fence.test.ts
      - .github/workflows/mm-apply-working-draft-revision-fence.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Bind browser Send to the approved revision
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/routes/mail.tsx")
          text = path.read_text()
          old = '''          body: JSON.stringify({
            mailSessionToken: session.mailSessionToken ?? "",
            draftId,
          }),'''
          new = '''          body: JSON.stringify({
            mailSessionToken: session.mailSessionToken ?? "",
            draftId,
            expectedRevision: workingRevisionRef.current,
          }),'''
          if new not in text:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"mail.tsx: expected one Send body, found {count}")
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run targeted regression test
        run: npx vitest run src/lib/__tests__/mail-working-draft-send-revision-fence.test.ts

      - name: Build production bundle
        run: npm run build

      - name: Commit validated client binding and remove temporary workflow
        shell: bash
        run: |
          git config user.name "MailMaestro Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/mm-apply-working-draft-revision-fence.yml
          git add -- src/routes/mail.tsx
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "fix: send exact working draft revision"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

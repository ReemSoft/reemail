name: MailMaestro revision fence bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mm-revision-fence-bootstrap.yml

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/working-draft-send-revision-fence
          fetch-depth: 0

      - name: Bind browser Send to approved revision
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/mail.tsx')
          text = p.read_text()
          old = '''          body: JSON.stringify({
            mailSessionToken: session.mailSessionToken ?? "",
            draftId,
          }),'''
          new = '''          body: JSON.stringify({
            mailSessionToken: session.mailSessionToken ?? "",
            draftId,
            expectedRevision: workingRevisionRef.current,
          }),'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('Expected exactly one working-draft Send body')
              p.write_text(text.replace(old, new, 1))
          PY

      - name: Remove branch-only temporary workflow
        run: rm -f .github/workflows/mm-apply-working-draft-revision-fence.yml

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run targeted regression test
        run: npx vitest run src/lib/__tests__/mail-working-draft-send-revision-fence.test.ts

      - name: Production build
        run: npm run build

      - name: Commit verified branch changes
        shell: bash
        run: |
          git config user.name "MailMaestro Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- src/routes/mail.tsx
          git rm -f .github/workflows/mm-apply-working-draft-revision-fence.yml || true
          if git diff --cached --quiet; then
            echo "No branch changes needed"
            exit 0
          fi
          git commit -m "fix: send exact working draft revision"
          git push origin HEAD:fix/working-draft-send-revision-fence

name: MailMaestro revision fence bootstrap

on:
  push:
    branches: [main]
    paths: [.github/workflows/mm-revision-fence-bootstrap.yml]

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/working-draft-send-revision-fence
          fetch-depth: 0
      - name: Patch exact browser Send body
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/routes/mail.tsx')
          s=p.read_text()
          old='''          body: JSON.stringify({\n            mailSessionToken: session.mailSessionToken ?? "",\n            draftId,\n          }),'''
          new='''          body: JSON.stringify({\n            mailSessionToken: session.mailSessionToken ?? "",\n            draftId,\n            expectedRevision: workingRevisionRef.current,\n          }),'''
          if new not in s:
              assert s.count(old)==1, s.count(old)
              p.write_text(s.replace(old,new,1))
          PY
          rm -f .github/workflows/mm-apply-working-draft-revision-fence.yml
      - run: npm install --no-audit --no-fund
      - run: npx vitest run src/lib/__tests__/mail-working-draft-send-revision-fence.test.ts
      - run: npm run build
      - name: Commit validated branch changes
        shell: bash
        run: |
          git config user.name "MailMaestro Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- src/routes/mail.tsx
          git rm -f .github/workflows/mm-apply-working-draft-revision-fence.yml || true
          git commit -m "fix: send exact working draft revision"
          git push origin HEAD:fix/working-draft-send-revision-fence
